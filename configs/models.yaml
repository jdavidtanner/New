models:
  # GPT-2 family — small, fast on CPU, different architecture from Qwen/LLaMA
  - id: "openai-community/gpt2"
    family: "gpt2"
    type: "dense"
    tuning: "base"
    params_billions: 0.124
    alias: "gpt2-base"

  - id: "openai-community/gpt2-medium"
    family: "gpt2"
    type: "dense"
    tuning: "base"
    params_billions: 0.345
    alias: "gpt2-medium-base"

  - id: "openai-community/gpt2-large"
    family: "gpt2"
    type: "dense"
    tuning: "base"
    params_billions: 0.774
    alias: "gpt2-large-base"

  # Dense decoder-only — baseline architecture
  - id: "meta-llama/Llama-3.2-1B"
    family: "llama"
    type: "dense"
    tuning: "base"
    params_billions: 1.0
    alias: "llama-1b-base"

  - id: "meta-llama/Llama-3.2-1B-Instruct"
    family: "llama"
    type: "dense"
    tuning: "instruct"
    params_billions: 1.0
    alias: "llama-1b-instruct"

  - id: "meta-llama/Llama-3.2-3B"
    family: "llama"
    type: "dense"
    tuning: "base"
    params_billions: 3.0
    alias: "llama-3b-base"

  - id: "meta-llama/Llama-3.2-3B-Instruct"
    family: "llama"
    type: "dense"
    tuning: "instruct"
    params_billions: 3.0
    alias: "llama-3b-instruct"

  - id: "mistralai/Mistral-7B-v0.3"
    family: "mistral"
    type: "dense"
    tuning: "base"
    params_billions: 7.0
    alias: "mistral-7b-base"

  - id: "mistralai/Mistral-7B-Instruct-v0.3"
    family: "mistral"
    type: "dense"
    tuning: "instruct"
    params_billions: 7.0
    alias: "mistral-7b-instruct"

  - id: "Qwen/Qwen2.5-0.5B"
    family: "qwen"
    type: "dense"
    tuning: "base"
    params_billions: 0.5
    alias: "qwen-0.5b-base"

  - id: "Qwen/Qwen2.5-0.5B-Instruct"
    family: "qwen"
    type: "dense"
    tuning: "instruct"
    params_billions: 0.5
    alias: "qwen-0.5b-instruct"

  - id: "Qwen/Qwen2.5-1.5B-Instruct"
    family: "qwen"
    type: "dense"
    tuning: "instruct"
    params_billions: 1.5
    alias: "qwen-1.5b-instruct"

  - id: "Qwen/Qwen2.5-7B-Instruct"
    family: "qwen"
    type: "dense"
    tuning: "instruct"
    params_billions: 7.0
    alias: "qwen-7b-instruct"

  - id: "Qwen/Qwen2.5-14B-Instruct"
    family: "qwen"
    type: "dense"
    tuning: "instruct"
    params_billions: 14.0
    alias: "qwen-14b-instruct"

  # Mixture-of-experts
  - id: "mistralai/Mixtral-8x7B-v0.1"
    family: "mixtral"
    type: "moe"
    tuning: "base"
    params_billions: 46.7
    alias: "mixtral-8x7b-base"

  - id: "Qwen/Qwen1.5-MoE-A2.7B"
    family: "qwen-moe"
    type: "moe"
    tuning: "base"
    params_billions: 14.3
    alias: "qwen-moe-2.7b-base"

# Default sweep for Phase 2
default_sweep:
  - "llama-1b-base"
  - "llama-1b-instruct"
  - "llama-3b-base"
  - "mistral-7b-base"
  - "mistral-7b-instruct"
  - "qwen-0.5b-base"
