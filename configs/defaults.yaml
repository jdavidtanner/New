seed: 42
device: "cuda"          # "cuda" | "cpu" | "mps"
batch_size: 8
output_root: "results"
log_level: "INFO"
use_cached: false
num_workers: 4
dtype: "bfloat16"       # "float32" | "float16" | "bfloat16"
