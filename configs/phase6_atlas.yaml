phase: 6
name: "atlas_utility_test"

model:
  alias: "qwen-0.5b-instruct"
  load_in_8bit: false
  load_in_4bit: false

device: "cpu"
dtype: "float32"
max_new_tokens: 30
num_generations: 1
seed: 42

routing:
  policy: "threshold"              # "threshold" | "learned" | "rl"
  thresholds:
    low_curvature: 0.3             # answer directly
    medium_curvature: 0.6          # retrieve evidence
    high_curvature: 0.85           # ask for clarification / hedge
    # above 0.85 -> abstain

  curvature_proxy: "trajectory_divergence"
  completeness_signal: "nli_entailment"

retrieval:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 5
  index_type: "flat"               # "flat" | "ivf" | "hnsw"

baselines:
  vanilla: true
  rag_only: true
  calibrated: true
  self_consistency: true

evaluation:
  domain: "medical_advice"
  n_examples: 20
  metrics:
    - accuracy
    - coverage
    - nli_entailment
    - nli_contradiction
