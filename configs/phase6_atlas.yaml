phase: 6
name: "atlas_utility_test"

model:
  alias: "llama-1b-instruct"

routing:
  policy: "threshold"              # "threshold" | "learned" | "rl"
  thresholds:
    low_curvature: 0.3             # answer directly
    medium_curvature: 0.6          # retrieve evidence
    high_curvature: 0.85           # ask for clarification / hedge
    # above 0.85 -> abstain

  curvature_proxy: "trajectory_divergence"
  completeness_signal: "nli_entailment"

retrieval:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 5
  index_type: "flat"               # "flat" | "ivf" | "hnsw"

baselines:
  vanilla: true
  rag_only: true
  calibrated: true
  self_consistency: true

evaluation:
  metrics:
    - accuracy
    - abstention_f1
    - coverage
    - calibration_error
    - nli_entailment
    - nli_contradiction
  dataset: "trivia_qa"
  split: "validation"
  n_examples: 500
