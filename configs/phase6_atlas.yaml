phase: 6
name: "atlas_utility_test"

model:
  alias: "qwen-0.5b-instruct"
  load_in_8bit: false
  load_in_4bit: false

device: "cpu"
dtype: "float32"
max_new_tokens: 30
num_generations: 1
seed: 42

routing:
  policy: "threshold"
  calibrate_thresholds: true       # fit low/medium from entropy percentiles
  thresholds:
    low_curvature: 0.3             # overridden by calibration if enabled
    medium_curvature: 0.6
    high_curvature: 0.95           # clarify / abstain threshold kept fixed
  curvature_proxy: "trajectory_divergence"
  completeness_signal: "nli_entailment"

retrieval:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 5
  index_type: "flat"               # "flat" | "ivf" | "hnsw"

baselines:
  vanilla: true
  rag_only: true
  calibrated: true
  self_consistency: true

evaluation:
  domain: "arithmetic"
  n_examples: 20
  metrics:
    - accuracy
    - coverage
    - nli_entailment
    - nli_contradiction
